name: iOS Signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID: tr.okul.dilprogrami12d

jobs:
  signed-ipa:
    name: Build signed iPhone IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check required signing secrets
        shell: bash
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_PASS" ] || [ -z "$PROFILE" ] || [ -z "$TEAM" ]; then
            echo "Apple signing secrets are missing."
            echo "Read WINDOWS_IPHONE_CLOUD_BUILD.md before using this workflow."
            exit 2
          fi

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode and install dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool || true
          python -m venv .iosvenv
          source .iosvenv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==3.0.11" kivy-ios

      - name: Build Kivy and create Xcode project
        run: |
          source .iosvenv/bin/activate
          toolchain build kivy
          mkdir -p ios_cloud_output
          cd ios_cloud_output
          toolchain create 12DDilProgrami "$GITHUB_WORKSPACE/mobile_universal"

      - name: Import Apple certificate and provisioning profile
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          MOBILEPROVISION: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/12d-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-12d-temporary-keychain}"

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          echo "$MOBILEPROVISION" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KC_PASS" \
            "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Apply project settings
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          PROJ_DIR="$GITHUB_WORKSPACE/ios_cloud_output/12DDilProgrami-ios"

          ASSETS="$(find "$PROJ_DIR" -type d -name 'Assets.xcassets' | head -n 1 || true)"
          if [ -n "$ASSETS" ]; then
            rm -rf "$ASSETS/AppIcon.appiconset"
            cp -R "$GITHUB_WORKSPACE/mobile_universal/ios/AppIcon.appiconset" "$ASSETS/AppIcon.appiconset"
          fi

          PLIST="$(find "$PROJ_DIR" -maxdepth 6 -name '*Info.plist' -type f | head -n 1 || true)"
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 12/D Dil Programi" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Speaking pratiklerinde Ingilizce konusma icin mikrofon kullanilir." "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Speaking pratiklerinde konusmayi metne cevirmek icin konusma tanima kullanilabilir." "$PLIST" 2>/dev/null || true
          fi

            /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string tr" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string tr" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$PLIST"

          PBX="$(find "$PROJ_DIR" -maxdepth 6 -name 'project.pbxproj' -type f | head -n 1)"
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBX"
          sed -i '' -E "s/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" "$PBX" || true
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]+;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBX"

      - name: Archive signed app
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          XCODEPROJ="$(find "$GITHUB_WORKSPACE/ios_cloud_output" -name '*.xcodeproj' -type d | head -n 1)"
          SCHEME="$(xcodebuild -project "$XCODEPROJ" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/12D_Dil_Programi.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_STYLE=Manual \
            clean archive

      - name: Create ExportOptions.plist
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa_output"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/12D_Dil_Programi.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/ipa_output" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 12D-Dil-Programi-iPhone-IPA
          path: ipa_output/*.ipa
          if-no-files-found: error
          retention-days: 7
