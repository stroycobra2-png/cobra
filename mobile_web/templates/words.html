{% extends "base.html" %}{% block content %}<div class="page-head"><p class="eyebrow">KELİME MERKEZİ</p><h1>Kelimeler</h1><p class="muted">{{ total }} kelime • {{ due }} tekrar bekliyor</p></div><form class="searchbar"><input name="q" value="{{ q }}" placeholder="İngilizce veya Türkçe ara"><label class="check"><input type="checkbox" name="fav" value="1" {% if fav %}checked{% endif %} onchange="this.form.submit()"> Sadece ★</label></form><section class="word-list">{% for w in words %}<div class="word-row"><form method="post" action="/word/{{ w['id'] }}/favorite"><button class="star">{% if w['favorite'] %}★{% else %}☆{% endif %}</button></form><span><b>{{ w['word'] }}</b><small>{{ w['level_code'] }} • {{ w['translation'] }} • tekrar {{ w['due_date'] }}</small></span><button class="mini speak-btn" data-speak="{{ w['word']|e }}">🔊</button></div>{% else %}<div class="empty">Kelime bulunamadı.</div>{% endfor %}</section>{% endblock %}
