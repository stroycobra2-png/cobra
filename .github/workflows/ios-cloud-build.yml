name: iOS Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS project on macOS
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config
          brew link libtool || true

      - name: Create Python environment
        run: |
          python -m venv .iosvenv
          source .iosvenv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==3.0.11" kivy-ios

      - name: Build Kivy for iOS
        run: |
          source .iosvenv/bin/activate
          toolchain build kivy

      - name: Create Xcode project
        run: |
          source .iosvenv/bin/activate
          rm -rf ios_cloud_output
          mkdir -p ios_cloud_output
          cd ios_cloud_output
          toolchain create 12DDilProgrami "$GITHUB_WORKSPACE/mobile_universal"

      - name: Add iPhone/iPad app icons
        shell: bash
        run: |
          set -e
          PROJ_DIR="$GITHUB_WORKSPACE/ios_cloud_output/12DDilProgrami-ios"
          ASSETS="$(find "$PROJ_DIR" -type d -name 'Assets.xcassets' | head -n 1 || true)"
          if [ -n "$ASSETS" ]; then
            rm -rf "$ASSETS/AppIcon.appiconset"
            cp -R "$GITHUB_WORKSPACE/mobile_universal/ios/AppIcon.appiconset" "$ASSETS/AppIcon.appiconset"
          fi

      - name: Apply iOS permissions and bundle settings
        shell: bash
        run: |
          set -e
          PROJ_DIR="$GITHUB_WORKSPACE/ios_cloud_output/12DDilProgrami-ios"
          PLIST="$(find "$PROJ_DIR" -maxdepth 6 -name '*Info.plist' -type f | head -n 1 || true)"
          PBX="$(find "$PROJ_DIR" -maxdepth 6 -name 'project.pbxproj' -type f | head -n 1 || true)"

          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 12/D Dil Programi" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 12/D Dil Programi" "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Speaking pratiklerinde Ingilizce konusma icin mikrofon kullanilir." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Speaking pratiklerinde Ingilizce konusma icin mikrofon kullanilir." "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Speaking pratiklerinde konusmayi metne cevirmek icin konusma tanima kullanilabilir." "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription Speaking pratiklerinde konusmayi metne cevirmek icin konusma tanima kullanilabilir." "$PLIST"

            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          fi

          if [ -n "$PBX" ]; then
            sed -i '' -E 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = tr.okul.dilprogrami12d;/g' "$PBX" || true
            sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]+;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' "$PBX" || true
          fi

      - name: Discover generated Xcode project
        id: project
        shell: bash
        run: |
          set -e
          XCODEPROJ="$(find "$GITHUB_WORKSPACE/ios_cloud_output" -name '*.xcodeproj' -type d | head -n 1)"
          if [ -z "$XCODEPROJ" ]; then
            echo "Xcode project not found."
            exit 1
          fi
          echo "path=$XCODEPROJ" >> "$GITHUB_OUTPUT"
          xcodebuild -project "$XCODEPROJ" -list

      - name: Build unsigned iPhone Simulator app
        shell: bash
        run: |
          set -e
          XCODEPROJ="${{ steps.project.outputs.path }}"
          SCHEME="$(xcodebuild -project "$XCODEPROJ" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Xcode project
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios_cloud_output \
            12D_Dil_Programi_iOS_Xcode_Project.zip

      - name: Upload iOS Xcode project artifact
        uses: actions/upload-artifact@v4
        with:
          name: 12D-Dil-Programi-iOS-Xcode-Project
          path: 12D_Dil_Programi_iOS_Xcode_Project.zip
          if-no-files-found: error
          retention-days: 14
