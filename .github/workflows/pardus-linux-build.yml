name: Pardus Linux Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pardus:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pardus_build/requirements-pardus.txt

      - name: Pardus/Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libportaudio2 portaudio19-dev espeak-ng espeak-ng-data libespeak-ng1 \
            libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 libxrender1 \
            libxi6 libxext6 libsm6 libice6 curl file desktop-file-utils

      - name: Python dependencies
        working-directory: pardus_build
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-pardus.txt

      - name: Python source checks
        working-directory: pardus_build
        run: |
          python -m py_compile main.py app/*.py
          python - <<'PY'
          from app.services import SpeechService, speaking_score, writing_score
          from app.database import Database
          print('Pardus source import: PASS')
          PY

      - name: Build DEB and AppImage
        working-directory: pardus_build
        run: bash build_pardus.sh

      - name: Inspect outputs
        run: |
          file pardus_build/out/*.deb pardus_build/out/*.AppImage
          cat pardus_build/out/SHA256SUMS.txt

      - name: Upload Pardus packages
        uses: actions/upload-artifact@v4
        with:
          name: 12D-Dil-Programi-Pardus
          path: |
            pardus_build/out/*.deb
            pardus_build/out/*.AppImage
            pardus_build/out/*.txt
          if-no-files-found: error
          retention-days: 14
